name: FastAPI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Format, lint, type check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting with Black
        run: black --check web_app

      - name: Lint with Pylint
        run: pylint web_app --ignore=.cum_exo,__pycache__

      - name: Type check with Mypy
        run: mypy web_app --exclude '(^|/)\.cum_exo/'

      - name: Run unit tests
        run: pytest --cov=web_app --cov-report=term-missing
